[agent]
  interval = "10s"
  flush_interval = "10s"
  precision = "1ns"
  omit_hostname = true

[[inputs.mqtt_consumer]]
  servers = ["tcp://mosquitto:1883"]
  topics = ["microgrid/#"]
  qos = 0
  data_format = "json"
  json_time_key = "ts"
  json_time_format = "unix_ns"
  topic_tag = "topic"

[[processors.regex]]
  order = 1
  [[processors.regex.tags]]
    key = "topic"
    pattern = "^microgrid/([^/]+)/([^/]+)/([^/]+)$"
    replacement = "${1}"
    result_key = "node_id"
  [[processors.regex.tags]]
    key = "topic"
    pattern = "^microgrid/([^/]+)/([^/]+)/([^/]+)$"
    replacement = "${2}"
    result_key = "subsystem"
  [[processors.regex.tags]]
    key = "topic"
    pattern = "^microgrid/([^/]+)/([^/]+)/([^/]+)$"
    replacement = "${3}"
    result_key = "metric"

# Splits each burst into one point per sample, at ts + k * dt_ns, in the `samples` measurement.
# The original burst point (mqtt_consumer, v_0..v_19) is kept too, so existing dashboards and the
# liveness check are unaffected. Fallback for when the full-rate DAQ2 path isn't in use.
[[processors.starlark]]
  order = 2
  source = '''
def apply(metric):
    if "dt_ns" not in metric.fields or "v_0" not in metric.fields:
        return metric
    dt = int(metric.fields["dt_ns"])
    sync = metric.fields.get("sync")
    out = [metric]
    # Starlark has no while loop; bursts are 20 samples, so 1024 is ample
    for k in range(1024):
        key = "v_" + str(k)
        if key not in metric.fields:
            break
        sample = Metric("samples")
        for name, value in metric.tags.items():
            sample.tags[name] = value
        sample.fields["v"] = metric.fields[key]
        if sync != None:
            sample.fields["sync"] = sync
        sample.time = metric.time + k * dt
        out.append(sample)
    return out
'''

[[outputs.influxdb_v2]]
  urls = ["http://influxdb:8086"]
  token = "${INFLUXDB_TOKEN}"
  organization = "qut-microgrid"
  bucket = "telemetry"
